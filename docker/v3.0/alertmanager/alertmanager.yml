# Alertmanager 告警配置
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.qq.com:587'
  smtp_from: 'feiyu-admin@qq.com'
  smtp_auth_username: 'feiyu-admin@qq.com'
  smtp_auth_password: 'your_smtp_password'
  smtp_require_tls: true

# 路由树
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'dingtalk'
  routes:
    # P1 紧急告警：立即发送
    - match:
        severity: critical
      receiver: 'dingtalk'
      group_wait: 0s
      repeat_interval: 1h
    # P2 严重告警：快速通知
    - match:
        severity: warning
      receiver: 'wecom'
      group_wait: 30s
    # P3 警告：常规通知
    - match:
        severity: info
      receiver: 'email'

# 接收者定义
receivers:
  # 钉钉机器人（紧急）
  - name: 'dingtalk'
    webhook_configs:
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_DINGTALK_TOKEN'
        send_resolved: true

  # 企业微信机器人（警告）
  - name: 'wecom'
    webhook_configs:
      - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WECOM_KEY'
        send_resolved: true

  # 邮件（提示）
  - name: 'email'
    email_configs:
      - to: 'ops-team@company.com'
        send_resolved: true
        headers:
          subject: '【{{ .Status | toUpper }}】{{ .GroupLabels.alertname }}'

# 抑制规则（避免重复告警）
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']
