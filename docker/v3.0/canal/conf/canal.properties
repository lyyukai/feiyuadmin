# Canal Server 配置
canal.id= 100
canal.server.ip= 127.0.0.1
canal.port= 11111
canal.zkServers= 
# 注册到 admin
canal.admin.manager= 127.0.0.1:8089
canal.admin.port= 11110
canal.admin.user= admin
canal.admin.passphrase= admin

# 存储
canal.data.dir= /home/admin/canal-server/data
canal.conf.dir= /home/admin/canal-server/conf
# 历史配置保留
canal.auto.scan= true
canal.auto.scan.interval= 5

# 数据解析协议
canal.protocol= tcp
canal.socketBuffer= 16384
canal.bufferSize= 16384
canal.batchSize= 1
canal.retentionTime= 3600
canal.fetchData.waitTime= 100

# 过滤规则（默认全量）
canal.filter.regex= .*\\..*
canal.filter.black.regex= 
canal.filter.whitelist=

# 模拟 MySQL 主从
canal.mq扁平化=false
canal.mq.顺序消息= false
canal.mq.ACK= true

# 网络参数
canal.tcp.bind.ip= 0.0.0.0
canal.tcp.buffer.size= 16384
canal.tcp.write.buffer.size= 16384
canal.tcp.read.buffer.size= 16384
canal.tcp.connect.size= 10

# 压缩
canal.compression.enable= false
canal.compression.compressBufferSize= 4096
