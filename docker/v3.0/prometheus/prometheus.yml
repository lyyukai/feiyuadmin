# Prometheus 配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'feiyuadmin-v3'
    env: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # ========== Prometheus 自身 ==========
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ========== 服务器资源（node_exporter）==========
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: 'server'
          hostname: 'feiyu-server'

  # ========== MySQL（mysqld_exporter）==========
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld_exporter:9104']
        labels:
          service: 'database'
          db_type: 'mysql'

  # ========== Redis（redis_exporter）==========
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
        labels:
          service: 'cache'
          db_type: 'redis'

  # ========== Canal Server 指标 ==========
  - job_name: 'canal'
    static_configs:
      - targets: ['canal-server:11112']
        labels:
          service: 'canal'
