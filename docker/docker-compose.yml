version: '3.8'

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.2
    container_name: feiyu_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feiyuadmin}
      MYSQL_USER: ${MYSQL_USER:-feiyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-feiyu123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - feiyu_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM 服务
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feiyu_php
    restart: always
    ports:
      - "${PHP_PORT:-9000}:9000"
    volumes:
      - ..:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_UPLOAD_MAX_FILESIZE: 100M
      PHP_POST_MAX_SIZE: 100M
    networks:
      - feiyu_network
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx 服务
  nginx:
    image: nginx:alpine
    container_name: feiyu_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - feiyu_network
    depends_on:
      - php

networks:
  feiyu_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
